# Seeded clue-graph generator configuration (DESIGN.md §4.5, Phase 3).
# Every playthrough regenerates the mystery from the world seed: role
# assignment, tomb site, and texts vary; solvability is proven at
# generation time (tests/clues.rs + Game::new) and preserved by rivals.

version = 1

[expedition]
# Candidate tomb tiles across both regions; the generator picks one per seed.
tomb_candidates = [[20, 26], [24, 21], [17, 12], [34, 58], [24, 40], [8, 48], [38, 44]]

[generator]
# Settlements the generator distributes the clue graph across: Lower Egypt
# and the Sahara/Sahel corridor (DESIGN.md §3.1, roadmap step 4).
settlements = ["cairo", "asyut", "luxor", "aswan", "kharga", "dakhla", "kufra", "zinder", "kano"]
# Item the key leg grants and requires elsewhere.
key_item = "brass_key"
# Rival explorers of this run (DESIGN.md §4.8).
rivals = ["Mr. Harcourt", "Dr. Voss"]
# Number of red herrings generated (each falsifiable via a corroboration).
herrings = 1
# Reputation gate ranges for clue nodes.
rep_gate_min = 3
rep_gate_max = 6

# Text templates. {settlement} and {npc} are replaced with the assigned
# names; {key} with the key item's display name.
[[template]]
kind = "hint"
text = "The trail is no secret to the old ones. Ask in {settlement}; {npc} there knows more than he lets on."

[[template]]
kind = "key"
text = "What was sealed must be opened. In {settlement} they keep the {key} — it has been waiting for a question like yours."

[[template]]
kind = "corroboration"
text = "The {key} speaks true. I have seen the records: what was buried is not by the river. Ask the one at {settlement}."

[[template]]
kind = "location"
text = "Two days' march east of {settlement}, past the quarries, the hills split open under the red rock. There the king sleeps."

[[template]]
kind = "hint"
red_herring = true
text = "They say the old king was buried beneath the river itself, where the Nile bends — a tomb under water, for a fool to dive for."
