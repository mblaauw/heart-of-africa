# Region knowledge for Lower Egypt & the Nile (EXPANSION_PLAN §WS2).
# Direction/distance terms, gift culture, terrain lore, landmark terms,
# and etiquette facts — one file per region. A typo here fails
# `cargo test` (content lint), the same guardrail as other content files.

version = 1

# The region id this knowledge attaches to (matches World.regions[].id).
region = "lower-egypt-nile"

# Direction terms the region's people use (replaces default compass terms).
