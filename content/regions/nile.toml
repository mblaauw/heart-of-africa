  "upstream",
  "downstream",
  "toward the river",
  "inland",
]

# Distance terms (replaces default distance-band phrases).
distance_terms = [
  "a short walk",
  "half a day's march",
  "a full day's ride",
  "two days' march",
  "a long journey",
]

# Gifts that earn goodwill in this region.
preferred_gifts = [
  "coffee",
  "tobacco",
]

# Gifts that are offensive in this region.
