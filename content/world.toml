# Heart of Africa — world data, Lower Egypt & the Nile (DESIGN.md §3.1)
# Source of truth for the map: content/maps/nile.txt (ASCII), rendered by:
#   hoatool gen-map content/world.toml content/maps/nile.txt content/maps/nile.png
# A typo here fails `cargo test` (content lint) — that is the intended guardrail.

version = 1

[map]
png = "maps/world.png"
legend = {
  "3a6ea5" = "water",
  "d9b36c" = "desert",
  "8fae5c" = "floodplain",
  "c4b454" = "savanna",
  "8c7a6b" = "mountain",
  "5fbf8f" = "oasis",
}

[biome.water]
passable = false
movement_cost = 0.0

[biome.desert]
passable = true
movement_cost = 1.0

[biome.floodplain]
passable = true
movement_cost = 1.5

[biome.savanna]
passable = true
movement_cost = 1.0

[biome.mountain]
passable = true
movement_cost = 3.0

[biome.oasis]
passable = true
movement_cost = 1.0

[region]
id = "lower-egypt-nile"
name = "Lower Egypt & the Nile"
start_settlement = "cairo"

