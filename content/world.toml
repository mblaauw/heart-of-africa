# River metadata: a polyline that must run through water tiles.
# Points (tile x, tile y); y grows southward.
[[rivers]]
id = "nile"
name = "The Nile"
points = [
  [10, 2], [10, 3], [10, 4], [10, 5],           # delta, west branch
  [13, 2], [13, 3], [13, 4], [13, 5],           # delta, east branch
  [14, 6], [14, 7], [14, 8], [14, 9], [14, 10], [14, 11], [14, 12],
  [15, 13], [15, 14], [15, 15], [15, 16], [15, 17],
  [14, 18], [14, 19], [14, 20], [14, 21], [14, 22], [14, 23],
  [15, 24], [15, 25], [15, 26], [15, 27], [15, 28], [15, 29],
]

