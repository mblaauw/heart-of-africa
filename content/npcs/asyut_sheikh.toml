# Asyut's named NPC. The tomb question is a runtime slot filled by the
# seeded clue graph.

id = "asyut_sheikh"
name = "Sheikh Yusuf"
settlement = "asyut"
opening = "greet"
tomb_answer = "tomb_answer"
gift = { item = "coffee", rep_delta = 3 }

[[node]]
id = "greet"
text = "The sheikh of Asyut studies you from his carpet. 'Travelers pass through on their way to somewhere else. What is it you carry, that you stop here?'"

[[node.option]]
text = "Farewell."
effect = { end = true }

[[node]]
id = "tomb_answer"
text = "He studies you a long moment, then nods slowly. 'So. You are the one. Then hear what I have to tell you.'"

[[node.option]]
text = "Farewell."
effect = { end = true }

[[node]]
id = "gift_ack"
text = "'Coffee — a thoughtful gift. You are remembered kindly, stranger.'"

[[node.option]]
text = "Farewell."
effect = { end = true }
