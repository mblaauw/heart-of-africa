# Cairo's named NPC (DESIGN.md §6.1). The tomb question is a runtime slot:
# the seeded clue graph decides whether (and what) this NPC reveals.
# tomb_answer = the node shown after the player asks about the tomb.

id = "cairo_hakim"
name = "Hakim Ahmed"
settlement = "cairo"
opening = "greet"
tomb_answer = "tomb_answer"
gift = { item = "coffee", rep_delta = 3 }

[[node]]
id = "greet"
text = "The scholar Hakim Ahmed looks up from a stack of old papers. 'A visitor with money to spend and questions to ask — you are most welcome in Cairo.'"

[[node.option]]
text = "Who are you?"
go_to = "intro"

[[node.option]]
text = "Farewell."
effect = { end = true }

[[node]]
id = "intro"
text = "'I am Hakim Ahmed, scholar of the old kings. The Ottoman records and the French diggers both pass through my hands. If you seek the ancients, you have come to the right city.'"

[[node.option]]
text = "Farewell."
effect = { end = true }

[[node]]
id = "gift_ack"
text = "'You are generous — and generosity is remembered in Cairo.'"

[[node.option]]
text = "Farewell."
effect = { end = true }

[[node]]
id = "tomb_answer"
text = "He lowers his voice, glancing at the doorway. 'The old kings are a guarded subject. But you speak with respect — so listen.'"

[[node.option]]
text = "Farewell."
effect = { end = true }
