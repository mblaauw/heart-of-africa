# Aswan's named NPC. The tomb question is a runtime slot filled by the
# seeded clue graph; his knowledge is reputation-gated by the graph.

id = "aswan_guide"
name = "Guide Idris"
settlement = "aswan"
opening = "greet"
tomb_answer = "tomb_answer"

[[node]]
id = "greet"
text = "Guide Idris sits by the landing, mending a rope. 'The road south ends here, but the desert has its own roads.'"

[[node.option]]
text = "Give trade beads as a gift."
if = { has_item = "beads" }
effect = { take_item = "beads", rep_delta = 5 }
go_to = "gift_ack"

[[node.option]]
text = "Farewell."
effect = { end = true }

[[node]]
id = "gift_ack"
text = "'Beads from the coast — you honor the old ways. A man who gives is a man who can be trusted.'"

[[node.option]]
text = "Give trade beads as a gift."
if = { has_item = "beads" }
effect = { take_item = "beads", rep_delta = 5 }
go_to = "gift_ack"

[[node.option]]
text = "Farewell."
effect = { end = true }

[[node]]
id = "tomb_answer"
text = "'You have earned the truth.' He draws a line in the dust. 'Listen, and mark it well.'"

[[node.option]]
text = "Give trade beads as a gift."
if = { has_item = "beads" }
effect = { take_item = "beads", rep_delta = 5 }
go_to = "gift_ack"

[[node.option]]
text = "Farewell."
effect = { end = true }
