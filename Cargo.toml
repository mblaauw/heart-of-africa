[package]
name = "heart-of-africa"
version = "0.1.0"
edition = "2024"
description = "Remake of Heart of Africa (1985) — open-world 1890s Africa expedition mystery"
license = "MIT OR Apache-2.0"

[lib]
name = "heart_of_africa"
path = "src/lib.rs"

[[bin]]
name = "heart-of-africa"
path = "src/main.rs"

[[bin]]
name = "hoatool"
path = "src/bin/hoatool/main.rs"

[dependencies]
anyhow = "1.0.104"
egui = "0.31"
egui-macroquad = "0.17.3"
image = "0.25.10"
macroquad = "0.4.16"
noise = "0.9.0"
rand = "0.10.2"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.4"
ureq = { version = "3.3.0", optional = true }

[features]
# Optional LLM garnish (DESIGN.md §6): desktop-only, off by default.
llm = ["dep:ureq"]
